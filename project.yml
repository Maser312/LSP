name: LiDARScannerPro
options:
  bundleIdPrefix: com.maser312
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "12"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  LiDARScannerPro:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maser312.lidarscannerpro
        PRODUCT_NAME: LiDARScannerPro
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LiDAR Scanner Pro
        INFOPLIST_KEY_NSCameraUsageDescription: "Camera access is required for live LiDAR scanning and 3D reconstruction."
        INFOPLIST_KEY_UIRequiredDeviceCapabilities:
          - arkit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
